<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111a3a">
<title>Pin Scanner</title>
<style>
:root{
 --bg:#071126;--card:#111a3a;--card2:#17224b;--text:#f7f3e8;--muted:#b8bfd4;
 --gold:#f2c86b;--blue:#7db7ff;--violet:#a78bfa;--line:#2b3765;--danger:#ff8d8d;
}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:radial-gradient(circle at top,#202b66 0,#0a1430 38%,#050a18 100%);
color:var(--text);min-height:100vh}
header{padding:24px 18px 12px;text-align:center}
.brand{font-size:28px;font-weight:800;letter-spacing:.2px}
.spark{color:var(--gold)} .sub{color:var(--muted);font-size:14px;margin-top:5px}
main{max-width:760px;margin:auto;padding:10px 14px 100px}
.card{background:linear-gradient(180deg,rgba(25,36,79,.96),rgba(13,22,52,.96));border:1px solid var(--line);
border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 16px 40px rgba(0,0,0,.22)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
button,.btn{border:0;border-radius:14px;padding:13px 15px;font-size:16px;font-weight:700;cursor:pointer}
.primary{background:linear-gradient(135deg,var(--gold),#ffe4a2);color:#352500}
.secondary{background:#253465;color:white}.ghost{background:#152148;color:#dfe7ff;border:1px solid #36477c}
input,textarea{width:100%;border-radius:12px;border:1px solid #344575;background:#0a1430;color:white;
padding:12px;font-size:16px;margin:6px 0 12px}label{font-size:13px;color:#c8cee2}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
.status{padding:11px 13px;border-radius:12px;background:#0a1430;color:#dbe4ff;margin-top:10px}
.pinimg{width:100%;max-height:300px;object-fit:contain;border-radius:18px;background:#080d1c;margin:10px 0}
.candidate{border:1px solid #3a4b7c;border-radius:14px;padding:12px;margin:10px 0;background:#0d1737}
.candidate a{color:#91c5ff}.tiny{font-size:12px;color:var(--muted)}
.collection-item{border-top:1px solid var(--line);padding:12px 0}.collection-item:first-child{border-top:0}
@media(max-width:560px){.grid{grid-template-columns:1fr}.brand{font-size:25px}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="spark">✦</span> Pin Scanner <span class="spark">✦</span></div>
  <div class="sub">Barcode first • confirm once • remember forever</div>
</header>
<main>
<section class="card">
  <div class="row">
    <button class="primary" id="scanBtn">Scan Barcode</button>
    <button class="secondary" id="photoBtn">Take Pin Photo</button>
    <button class="ghost" id="lookupBtn">Lookup Settings</button>
  </div>
  <input id="barcode" inputmode="numeric" placeholder="Or type barcode / SKU">
  <button class="secondary" id="lookupNow">Look Up Barcode</button>
  <div class="status" id="status">Ready.</div>
  <video id="video" playsinline style="display:none;width:100%;border-radius:16px;margin-top:10px"></video>
  <canvas id="canvas" style="display:none"></canvas>
  <input id="photoInput" type="file" accept="image/*" capture="environment" style="display:none">
</section>

<section class="card" id="settings" style="display:none">
  <h3>Lookup Service</h3>
  <label>Cloudflare Worker URL</label>
  <input id="workerUrl" placeholder="https://your-worker.workers.dev">
  <div class="row">
    <button class="primary" id="saveWorker">Save</button>
    <button class="secondary" id="testWorker">Test Connection</button>
  </div>
</section>

<section class="card">
  <img id="pinImage" class="pinimg" style="display:none" alt="Pin photo">
  <div id="candidates"></div>
  <div class="grid">
    <div class="full"><label>Name</label><input id="name"></div>
    <div><label>Set</label><input id="set"></div>
    <div><label>Theme</label><input id="theme"></div>
    <div><label>Series</label><input id="series"></div>
    <div><label>Rarity</label><input id="rarity"></div>
    <div><label>Edition Type</label><input id="editionType"></div>
    <div><label>Edition Size</label><input id="editionSize"></div>
    <div><label>Original Price</label><input id="originalPrice"></div>
    <div><label>Release Date</label><input id="releaseDate" placeholder="e.g. February 2026"></div>
    <div><label>Origin</label><input id="origin"></div>
    <div><label>Source</label><input id="source"></div>
    <div class="full"><label>Description / Notes</label><textarea id="description" rows="3"></textarea></div>
  </div>
  <button class="primary" id="savePin">Confirm & Save Pin</button>
</section>

<section class="card">
  <h3>My Collection</h3>
  <div class="row">
    <button class="secondary" id="exportCsv">Export CSV</button>
    <button class="secondary" id="exportJson">Full Backup</button>
    <button class="ghost" id="importJson">Import Backup</button>
  </div>
  <input id="importFile" type="file" accept=".json,application/json" style="display:none">
  <div id="collection"></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const fields=["name","set","theme","series","rarity","editionType","editionSize","originalPrice","releaseDate","origin","source","description"];
let currentImage="";
let stream=null;

function worker(){return localStorage.getItem("pinWorkerUrl")||""}
function learned(){try{return JSON.parse(localStorage.getItem("pinLearned")||"{}")}catch{return{}}}
function collection(){try{return JSON.parse(localStorage.getItem("pinCollection")||"[]")}catch{return[]}}
function setStatus(s){$("status").textContent=s}

$("lookupBtn").onclick=()=>{$("settings").style.display=$("settings").style.display==="none"?"block":"none";$("workerUrl").value=worker()}
$("saveWorker").onclick=()=>{localStorage.setItem("pinWorkerUrl",$("workerUrl").value.trim().replace(/\/+$/,""));setStatus("Lookup service saved.")}
$("testWorker").onclick=async()=>{try{const r=await fetch(($("workerUrl").value.trim().replace(/\/+$/,""))+"/");const j=await r.json();setStatus(j.ok?"Connected successfully.":"Connection responded, but not as expected.")}catch(e){setStatus("Could not connect to lookup service.")}}

$("photoBtn").onclick=()=>$("photoInput").click();
$("photoInput").onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{currentImage=r.result;$("pinImage").src=currentImage;$("pinImage").style.display="block"};r.readAsDataURL(f)}

$("scanBtn").onclick=async()=>{
  if(!("BarcodeDetector" in window)){ setStatus("Live barcode scanning is not supported here. Use the camera/photo or type the barcode."); return; }
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    $("video").srcObject=stream;$("video").style.display="block";await $("video").play();
    const detector=new BarcodeDetector({formats:["upc_a","upc_e","ean_13","ean_8","code_128","qr_code"]});
    setStatus("Point the camera at the barcode…");
    const loop=async()=>{
      if(!stream)return;
      try{
        const codes=await detector.detect($("video"));
        if(codes.length){
          const val=codes[0].rawValue;
          $("barcode").value=val;
          stream.getTracks().forEach(t=>t.stop());stream=null;$("video").style.display="none";
          await lookupBarcode(val);
          return;
        }
      }catch(e){}
      requestAnimationFrame(loop);
    };
    loop();
  }catch(e){setStatus("Camera could not start. You can type the barcode instead.")}
};

$("lookupNow").onclick=()=>lookupBarcode($("barcode").value);

function fill(data){
  fields.forEach(k=>{if(data[k]!==undefined && data[k]!==null && data[k]!=="") $(k).value=data[k]});
  if(data.image){
    currentImage=data.image;$("pinImage").src=data.image;$("pinImage").style.display="block";
  }
}

async function lookupBarcode(raw){
  const barcode=(raw||"").replace(/\D/g,"");
  if(!barcode){setStatus("Enter or scan a barcode first.");return}
  $("barcode").value=barcode;
  $("candidates").innerHTML="";

  const local=learned()[barcode];
  if(local){
    fill(local);setStatus("Recognized from your saved pin database.");return;
  }

  const base=worker();
  if(!base){setStatus("Open Lookup Settings and paste your Cloudflare Worker URL first.");return}
  setStatus("Searching barcode databases and web results…");

  try{
    const r=await fetch(base+"/?barcode="+encodeURIComponent(barcode),{cache:"no-store"});
    const data=await r.json();

    if(data.found){
      fill(data);
      setStatus("Match found. Check the details, then Confirm & Save.");
      return;
    }

    if(data.candidates?.length){
      setStatus("Possible matches found. Open the results and choose the correct pin.");
      showCandidates(data.candidates, barcode);
      return;
    }

    setStatus("No automatic match yet. You can identify it once, fill the form, then Confirm & Save — this phone will remember the barcode.");
    if(data.searchUrl){
      const a=document.createElement("a");a.href=data.searchUrl;a.target="_blank";a.textContent="Search this barcode on the web";
      a.className="btn secondary";$("candidates").appendChild(a);
    }
  }catch(e){
    setStatus("Lookup failed. Check the Worker connection.");
  }
}

function showCandidates(items, barcode){
  $("candidates").innerHTML="<h3>Possible matches</h3>";
  items.forEach((c,i)=>{
    const d=document.createElement("div");d.className="candidate";
    d.innerHTML=`<strong>${escapeHtml(c.title||("Result "+(i+1)))}</strong>
      <div class="tiny">${escapeHtml((c.description||"").slice(0,260))}</div>
      <div style="margin-top:8px"><a href="${escapeAttr(c.url)}" target="_blank">Open result</a></div>
      <button class="ghost" style="margin-top:8px">Use title as pin name</button>`;
    d.querySelector("button").onclick=()=>{$("name").value=c.title||"";$("source").value=c.url||"";setStatus("Candidate selected. Add/correct any details, then Confirm & Save.")};
    $("candidates").appendChild(d);
  });
}

$("savePin").onclick=()=>{
  const barcode=$("barcode").value.replace(/\D/g,"");
  if(!barcode){setStatus("Scan or enter the barcode before saving.");return}
  const rec={barcode,image:currentImage,dateAdded:new Date().toISOString()};
  fields.forEach(k=>rec[k]=$(k).value.trim());
  if(!rec.name){setStatus("Add a pin name before saving.");return}

  const map=learned();map[barcode]=rec;localStorage.setItem("pinLearned",JSON.stringify(map));
  const all=collection();all.unshift(rec);localStorage.setItem("pinCollection",JSON.stringify(all));
  setStatus("Saved. This barcode will now autofill instantly on this phone.");
  renderCollection();
};

function renderCollection(){
  const all=collection();$("collection").innerHTML=all.length?"":"<p class='tiny'>No saved pins yet.</p>";
  all.slice(0,100).forEach(p=>{
    const d=document.createElement("div");d.className="collection-item";
    d.innerHTML=`<strong>${escapeHtml(p.name||"Unnamed pin")}</strong><div class="tiny">${escapeHtml(p.barcode||"")} • ${escapeHtml(p.series||p.set||"")}</div>`;
    $("collection").appendChild(d);
  });
}

$("exportCsv").onclick=()=>{
  const all=collection();
  const cols=["barcode","name","set","theme","series","rarity","editionType","editionSize","originalPrice","releaseDate","origin","source","description","dateAdded"];
  const csv=[cols.join(","),...all.map(r=>cols.map(k=>`"${String(r[k]||"").replace(/"/g,'""')}"`).join(","))].join("\n");
  download(new Blob([csv],{type:"text/csv"}),"pin-collection.csv");
};
$("exportJson").onclick=()=>download(new Blob([JSON.stringify({collection:collection(),learned:learned()},null,2)],{type:"application/json"}),"pin-scanner-backup.json");
$("importJson").onclick=()=>$("importFile").click();
$("importFile").onchange=async e=>{
  try{
    const j=JSON.parse(await e.target.files[0].text());
    if(j.collection)localStorage.setItem("pinCollection",JSON.stringify(j.collection));
    if(j.learned)localStorage.setItem("pinLearned",JSON.stringify(j.learned));
    renderCollection();setStatus("Backup imported.");
  }catch{setStatus("That backup file could not be read.")}
};
function download(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function escapeAttr(s){return escapeHtml(s)}
renderCollection();
$("workerUrl").value=worker();
</script>
</body>
</html>
